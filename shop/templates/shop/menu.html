{% load static%}
<nav class="navbar shadow p-3 mb-4 sticky-top" style="background-color:rgb(98, 132, 98)">
  <div class="container-fluid">
    <a class="navbar-brand link-light" href="{% url 'shop' %}">
        <img src="{% static 'bilder/logo-1.png' %}" alt="Logo von der Firma Techmax">
    </a>
  
  
      <div class="navbar-nav">
        <div class="d-flex align-items-center">
          <h5 class="text-light m-2">Hallo {{request.user|title}}</h5>
          {% if request.user.is_authenticated %}
           <a class=" btn btn-light p-2" href="{% url 'logout' %}">Logout</a>
          {% else %}
          {% comment %} Login Button: {% endcomment %}
          <a class="btn btn-light p-2" href="{% url 'login' %}">Login</a>
         {% endif %}
        <a class="nav-link link-light p-2" href="{% url 'warenkorb' %}">
            <img src="{% static 'bilder/floppy.png' %}" alt="">
            {% if menge >= 1%}
            <span class="badge rounded-pill bg-danger position-absolut top-25 start-25 translate-middle">
              {{menge}}
            </span>
            {% endif %}
        </a>
       
      </div>
    </div>
 </div>
</nav>
