{% extends "shop/index.html" %}
{% load static %}

{% block content%}
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4">
      {% for artikel in artikels %}
       <div class="col mb-3">
         <div class="card h-100" style="max-width: 35rem;">
            {% if artikel.bild %}
                <img src="{{ artikel.bild.url}}" class="card-img-top" alt="...">
            {% else %}
                <img src="{% static 'bilder/dummy.jpg' %}" class="card-img-top" alt="...">
            {% endif %}
             <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{artikel.name}}</h5>
                <p class="card-text">{{artikel.beschreibung}}</p>
                <div class="d-flex justify-content-between align-items-baseline mt-auto">
                    <h5 class="text-secondary mb-0">{{artikel.preis|floatformat:2}} €</h5>
                    <button data-artikel={{artikel.id}} data-action="bestellen" class="btn btn-outline-danger warenkorb-bestellen">Bestellen</button>
                </div>           
             </div>
        </div>
       </div> 
     {% endfor %}
    </div>
{% endblock content %}
